# XcodeGen spec — the source of truth for the Xcode project.
#
# The .xcodeproj is generated, not edited by hand and not committed. Regenerate with:
#     xcodegen generate
#
# Two targets, sharing Sources/Shared by compiling it into both (no shared framework —
# a framework would add embedding overhead against the extension's memory budget, C-10).

name: KeyboardProject

options:
  bundleIdPrefix: com.srijan
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    # XcodeGen pins SWIFT_VERSION to 5.0 at project level whether you ask or not, so state
    # it rather than discover it. Swift 5 mode makes isolation violations warnings instead
    # of hard errors; the two settings below give Swift 6's code shape now, so flipping
    # SWIFT_VERSION to "6.0" later is a one-line migration.
    #
    # Verified 2026-08-22: `xcodebuild ... SWIFT_VERSION=6.0` builds both targets with zero
    # errors and zero warnings from our own sources. Re-check it after touching anything that
    # crosses an actor boundary — `Sources/Shared` compiles into both targets and is reached
    # from a background queue by the keyboard handshake, which is exactly where this breaks
    # first (both `AppGroup` and `KeyboardHandshake` are `nonisolated` for that reason).
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Xcode applies this only to `application` product types, which would leave the app
    # MainActor-isolated and the extension nonisolated — two concurrency worlds in one
    # project. Setting it at project level keeps both targets consistent.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO          # explicit plists — the extension's NSExtension dict is load-bearing
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES

targets:

  # ---------------------------------------------------------------- host app
  KeyboardProject:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/HostApp
      # The keyboard's views compile into the app too, so the host app can render the real
      # keyboard for side-by-side comparison against Gboard reference screenshots (M1/M2
      # exit criteria) without switching keyboards. The extension's own controller and
      # bundle files are excluded — XcodeGen only auto-excludes a target's OWN
      # INFOPLIST_FILE, so leaving these in would add them to Copy Bundle Resources.
      - path: Sources/Keyboard
        excludes:
          - "KeyboardViewController.swift"
          - "Info.plist"
          - "Keyboard.entitlements"
          - "PrivacyInfo.xcprivacy"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijan.keyboardproject
        PRODUCT_NAME: KeyboardProject
        INFOPLIST_FILE: Sources/HostApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/HostApp/HostApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must be restated per target: XcodeGen's iOS platform preset sets
        # TARGETED_DEVICE_FAMILY "1,2" at TARGET level, which beats anything in the
        # project-level base — set it only above and you silently ship a universal app.
        TARGETED_DEVICE_FAMILY: "1"
        # Same reason: the iOS application preset injects the legacy identity
        # "iPhone Developer" at target level, which no longer matches modern
        # certificates and fails signing on device.
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
    dependencies:
      - target: KeyboardExtension
        embed: true

  # -------------------------------------------------------- keyboard extension
  # Bundle ID must stay under the host app's, and must never start a segment with
  # "se." or "mn." — iOS has shipped bugs where such keyboards silently fail to
  # appear in Settings (ADR-008).
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijan.keyboardproject.keyboard
        PRODUCT_NAME: KeyboardExtension
        INFOPLIST_FILE: Sources/Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Keyboard/Keyboard.entitlements
        # See the host app — platform presets land at target level.
        TARGETED_DEVICE_FAMILY: "1"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        # XcodeGen does not set this for app-extension targets; without it,
        # `xcodebuild archive` leaves a stray .appex at the archive root.
        SKIP_INSTALL: YES
        # Defaults to YES for app extensions in Xcode 16+/26 and is a known source of
        # missing .debug.dylib load failures and invalid-code-signature errors. Those
        # present as "the keyboard doesn't work" with nothing useful to debug, which is
        # this project's characteristic failure mode. We don't use SwiftUI Previews in
        # the extension, so the feature it buys is worth nothing here.
        ENABLE_DEBUG_DYLIB: NO

  # ------------------------------------------------------------------- tests
  # Covers the typing rules and the layout maths — the parts whose failure mode is a
  # keyboard that feels subtly wrong rather than one that visibly breaks, and the only
  # part of M1 verifiable without hardware.
  KeyboardProjectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijan.keyboardproject.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
    dependencies:
      - target: KeyboardProject

  # --------------------------------------------------------------- UI tests
  # The unit tests above can only reach the rules; they cannot reach the *touch layer*.
  # Keys are not buttons — they are drawn rects with a raw UIKit `MultiTouchView` on top
  # (TouchTracker.swift), so hit-testing, rollover, press-vs-release semantics and
  # hold-to-repeat only exist once a real finger lands on a real coordinate. The only way
  # to exercise that is to drive actual touches, which is what XCUITest does.
  #
  # It drives the host app, not the extension: the host app compiles Sources/Keyboard in
  # and renders the same KeyboardRootView (see the host app target above), so these tests
  # hit the real keyboard code. What they cannot see is anything the extension process
  # owns — the text document proxy, real Full Access, haptics, the globe key, and the
  # memory budget. Those stay device-only, per the milestone exit criteria.
  #
  # There are no accessibility identifiers in Sources/ and none should be added for the
  # tests' benefit: tests tap by coordinate, derived from the same percentage layout
  # KeyboardMetrics uses.
  KeyboardProjectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijan.keyboardproject.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
    dependencies:
      - target: KeyboardProject

schemes:
  KeyboardProject:
    build:
      targets:
        KeyboardProject: all
        KeyboardExtension: all
        KeyboardProjectTests: [test]
        KeyboardProjectUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeyboardProjectTests
        - KeyboardProjectUITests
    archive:
      config: Release
